# Copier en alicia.config.yaml (non versionné). Les secrets vont dans .env.
port: 8780
host: "0.0.0.0"
discovery: true           # annonce le cerveau sur le réseau local (mDNS) : l'app le trouve toute seule au premier lancement
dataDir: "./data"
timezone: "Europe/Paris"
people:
  - { id: kevin, name: Kévin }
  - { id: elodie, name: Élodie }
engine:
  mode: subscription      # subscription | api_key
models:
  sonnet: claude-sonnet-5-5
  opus: claude-opus-5-5

# Pages web autorisées à appeler le cerveau en plus de l'app de bureau (future PWA).
# Origines exactes, en minuscules, sans port par défaut, sans chemin ni barre finale, ex. "https://alicia.mon-tailnet.ts.net".
allowedOrigins: []

# Coordonnées de la maison pour la météo (facultatif ; sans elles, pas d'outil météo).
# home:
#   latitude: 48.85
#   longitude: 2.35
